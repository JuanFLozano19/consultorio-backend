name: CI

on:
  push:
    branches: [main, preproduccion, desarrollo]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y correr pruebas
        run: ./mvnw -B test
      - name: Empaquetar
        run: ./mvnw -B -DskipTests package
